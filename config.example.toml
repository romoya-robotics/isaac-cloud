[defaults]
# "vast" (Vast.ai marketplace, cheap, instant) or "aws" (EC2 g6e, reliable, ~6x price)
provider = "vast"
instance_name_prefix = "isaac-cloud"
disk_gb = 100

[ngc]
api_key = "nvapi-your-ngc-api-key"

[ssh]
private_key_path = "/home/you/.ssh/id_ed25519"
public_key_path = "/home/you/.ssh/id_ed25519.pub"

# Isaac runtime options.
#   agent:  Isaac Sim's built-in control socket (isaacsim.code_editor.python_server).
#           Binds 127.0.0.1:8226 on the instance; reach it through the printed
#           SSH tunnel and drive it with the isaac-sim-remote skill.
#   curobo: install cuRobo (GPU motion planning) into Isaac's python after
#           launch. Background, ~5 min: torch cu128 + cuRobo (warp kernels, no
#           CUDA toolkit needed) + cuda-core. `status` reports "curobo: ready".
#   lab:    install Isaac Lab (robot-learning framework) into Isaac's python
#           after launch. Background, ~15 min; clones IsaacLab at `lab_ref`
#           into /root/IsaacLab. `status` reports "isaac_lab: ready". Lab
#           scripts start their own SimulationApp, so stop the streaming Isaac
#           process before running them, and keep outputs under
#           /isaac-sim/project so snapshots capture them.
#   lab_ref: IsaacLab git ref (tag or branch) to install. Lab releases are
#           paired with Isaac Sim versions — bump together with `version`.
[isaac]
version = "6.0.1"
agent = true
curobo = false
lab = false
# lab_ref = "v3.0.0-beta2.patch1"   # default; the release built for Isaac Sim 6.0.1

# Full interactive GUI via noVNC (Isaac GUI -> Xvfb -> x11vnc -> one TCP port).
# Works on any host with a driver that can present Vulkan on an X display
# (driver >= 590; `catalog --gui` ranks those first, the launch preflight
# aborts otherwise). NVENC not required. Brought up by /root/gui_stack.sh on
# the box (idempotent; `status` reports its gui_* checks). Open
# http://localhost:6080/vnc.html through the tunnel.
[gui]
enabled = false
resolution = "1920x1080"

# Native Isaac WebRTC in a local Chromium browser (Vast or AWS).
# Use `launch --webrtc` for one launch, or enable here with [gui].enabled=false.
# Launch a NEW instance with --webrtc. Vast also requires whole_machine=true.
# `webrtc --instance-id ID` serves the browser client, tunnels signaling, and
# restricts direct UDP media to your public IPv4. Build web-viewer first;
# see README.md. This is an experimental streaming workflow.
[webrtc]
enabled = false

[vast]
# Requires the vastai CLI: uv tool install vastai && vastai set api-key <KEY>
# whole_machine=true guarantees host GPU 0, which NVENC (RTSP/WebRTC video)
# requires. Fractional hosts are fine for agent-only or noVNC GUI work.
whole_machine = true
min_reliability = 0.99
# query = 'gpu_name in ["RTX_4090","L40S"] driver_version >= 580.95.05 verified=true rentable=true num_gpus=1 disk_space >= 80 inet_down >= 300'

[aws]
# Requires: aws login. Also requires G-instance vCPU quota > 0 in the region
# (Service Quotas code L-DB2E81BA).
region = "us-west-2"
instance_type = "g6e.xlarge"
# security_group = "isaac-cloud-ssh"
# key_name = "isaac-cloud"
# ami_ssm_param = "/aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id"

# Save/restore your Isaac project directory as append-only snapshots in S3:
# <s3_uri>projects/<project>/snapshots/<utc-timestamp>.tar.gz
# `launch` rehydrates the newest snapshot of the chosen project; `stop` and
# `destroy` save a new one first. Pick the project per-run with --project
# (different users or workstreams just use different project names).
[persistence]
enabled = false
s3_uri = "s3://your-bucket/isaac-cloud/"
aws_region = "us-west-2"
# project = "default"     # default project namespace; override with --project
# keep_last = 10          # snapshots kept per project (older ones are pruned)
